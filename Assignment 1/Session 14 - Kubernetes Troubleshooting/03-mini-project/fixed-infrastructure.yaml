apiVersion: v1
kind: Secret
metadata:
  name: missing-db-secret
type: Opaque
stringData:
  REDIS_PASSWORD: "SuperSecretProductionPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  labels:
    app: frontend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
      - name: web
        # Fix 1: Valid nginx image tag
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        # Fix 2: Correct readiness probe port matching containerPort
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  ports:
  - port: 80
    targetPort: 80
  # Fix 3: Correct matching selector
  selector:
    app: api-service
---
apiVersion: v1
kind: Pod
metadata:
  name: db-cache-pod
  labels:
    app: db-cache
spec:
  containers:
  - name: redis
    image: redis:7-alpine
    volumeMounts:
    - name: secret-data
      mountPath: /etc/secrets
  volumes:
  - name: secret-data
    secret:
      # Fix 4: Secret is now provisioned in cluster
      secretName: missing-db-secret
