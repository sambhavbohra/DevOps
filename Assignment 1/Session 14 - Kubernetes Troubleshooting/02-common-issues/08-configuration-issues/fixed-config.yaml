apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-app-config
data:
  SERVICE_PORT: "8080"
  DATABASE_NAME: "payments_db"
---
apiVersion: v1
kind: Pod
metadata:
  name: payment-app-fixed
spec:
  containers:
  - name: payment-api
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo 'Payment service listening on port' $$PORT && sleep 3600"]
    env:
    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: payment-app-config
          # Correct key matching ConfigMap
          key: SERVICE_PORT
