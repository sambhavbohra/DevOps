apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processing-engine
  namespace: production
  labels:
    app: order-engine
    managed-by: argocd-gitops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-engine
  template:
    metadata:
      labels:
        app: order-engine
    spec:
      containers:
      - name: engine
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-processing-service
  namespace: production
  labels:
    app: order-engine
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: order-engine
