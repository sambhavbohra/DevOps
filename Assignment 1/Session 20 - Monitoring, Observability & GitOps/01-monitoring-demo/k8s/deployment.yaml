apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-app
  labels:
    app: telemetry-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-app
  template:
    metadata:
      labels:
        app: telemetry-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: metrics-service
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - pip install flask prometheus-client psutil && python -c "
import time, psutil
from flask import Flask, jsonify, Response
from prometheus_client import Counter, Histogram, Gauge, generate_latest, CONTENT_TYPE_LATEST

app = Flask(__name__)
REQ_COUNT = Counter('http_requests_total', 'Total HTTP Requests', ['endpoint'])
CPU_GAUGE = Gauge('process_cpu_percent', 'CPU %')

@app.route('/health')
def health():
    REQ_COUNT.labels(endpoint='/health').inc()
    return jsonify(status='HEALTHY', student='Sambhav D Bohra')

@app.route('/metrics')
def metrics():
    CPU_GAUGE.set(psutil.cpu_percent())
    return Response(generate_latest(), mimetype=CONTENT_TYPE_LATEST)

app.run(host='0.0.0.0', port=8000)
"
        ports:
        - containerPort: 8000
          name: metrics-port
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  labels:
    app: telemetry-app
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: metrics
  selector:
    app: telemetry-app
