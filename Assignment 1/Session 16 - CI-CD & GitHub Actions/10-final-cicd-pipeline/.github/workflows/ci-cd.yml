name: CI-CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sambhavbohra/cicd-demo-service

jobs:
  # ============================
  # Continuous Integration (CI)
  # ============================
  lint-and-test:
    name: CI - Lint, Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter Checks
        run: npm run lint

      - name: Run Automated Unit Tests
        run: npm test

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: package.json
          retention-days: 7

  # ============================
  # Continuous Delivery (CD)
  # ============================
  build-and-package:
    name: CD - Container Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    name: CD - Deploy to Staging Cluster
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        run: |
          echo "Simulating authentication with staging cluster credentials from secrets..."
          echo "Kubeconfig context configured successfully."

      - name: Apply Kubernetes Manifests
        run: |
          echo "Deploying manifests to staging namespace..."
          cat k8s/deployment.yaml

      - name: Verify Staging Rollout
        run: |
          echo "Verifying rollout status on staging cluster..."
          echo "Deployment cicd-demo-app successfully rolled out."

  deploy-production:
    name: CD - Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Production Kubernetes Cluster
        run: |
          echo "Production deployment initiated with approval gate passed."
          echo "Rolling out version ${{ github.sha }} to production namespace."
          echo "All production health checks passed with zero downtime."
