apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-platform-deployment
  labels:
    app: order-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: order-api
        image: registry.k8s.io/hpa-example
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: order-platform-config
        - secretRef:
            name: order-platform-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 2
        volumeMounts:
        - name: transaction-logs
          mountPath: /var/log/app
      volumes:
      - name: transaction-logs
        persistentVolumeClaim:
          claimName: order-platform-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: order-platform-service
  labels:
    app: order-platform
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: order-platform
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-platform-hpa
  labels:
    app: order-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-platform-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-platform-ingress
  labels:
    app: order-platform
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: orders.scaler.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: order-platform-service
            port:
              number: 80
