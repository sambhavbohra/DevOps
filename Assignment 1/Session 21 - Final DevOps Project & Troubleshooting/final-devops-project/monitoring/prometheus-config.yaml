apiVersion: v1
kind: ConfigMap
metadata:
  name: final-prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'order-platform'
        static_configs:
          - targets: ['order-platform-service.default.svc.cluster.local:80']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: final-alert-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: platform-alerts
      rules:
      - alert: OrderApiLatencyHigh
        expr: http_request_duration_seconds_sum / http_request_duration_seconds_count > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP latency on Order API"
      - alert: OrderPlatformReplicasDegraded
        expr: kube_deployment_status_replicas_available{deployment="order-platform-deployment"} < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Available pod replicas below SLA threshold"
---
{
  "annotations": { "list": [] },
  "title": "Enterprise Order Platform Dashboard",
  "panels": [
    {
      "title": "HTTP Request Throughput",
      "type": "graph",
      "targets": [{ "expr": "rate(http_requests_total[1m])" }]
    },
    {
      "title": "Average Request Latency",
      "type": "gauge",
      "targets": [{ "expr": "http_request_duration_seconds_sum / http_request_duration_seconds_count" }]
    }
  ]
}
