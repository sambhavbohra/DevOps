apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo-pod
  labels:
    app: storage-demo
spec:
  containers:
  - name: writer-container
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - while true; do
          date >> /shared-data/timestamp.log;
          echo "Writing log line from writer container" >> /shared-data/timestamp.log;
          sleep 5;
        done
    volumeMounts:
    - name: shared-storage
      mountPath: /shared-data
  - name: reader-container
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - while true; do
          if [ -f /shared-data/timestamp.log ]; then
            echo "--- Reading from shared volume ---";
            tail -n 3 /shared-data/timestamp.log;
          fi;
          sleep 10;
        done
    volumeMounts:
    - name: shared-storage
      mountPath: /shared-data
  volumes:
  - name: shared-storage
    emptyDir: {}
